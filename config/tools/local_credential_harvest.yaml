tool_id: local_credential_harvest
required_binary: sshpass
scope_param: target
destructive: false

description: >
  Reads a fixed list of 14 well-known credential-bearing files on a host
  already reached via SSH, in one sshpass-driven SSH session running one
  bounded read-only script: ~/.ssh/id_rsa, id_ed25519, id_ecdsa,
  ~/.aws/credentials, ~/.aws/config, ~/.kube/config,
  ~/.docker/config.json, ~/.npmrc, ~/.pypirc, ~/.netrc,
  ~/.bash_history, ~/.zsh_history (all relative to the login user's home
  directory), plus /etc/wireguard/wg0.conf and /etc/wireguard/wg1.conf
  (system-wide, wg-quick's own default location -- commonly unreadable
  unless the login user has root-level access, which is itself a
  meaningful result). Small text credential files (AWS, kube, docker,
  npm, pypi, netrc, WireGuard -- the latter's base64 private key is one
  line embedded in an otherwise small config, with no clean way to
  redact just the key) are returned in full, capped at 64 KiB each. SSH
  private keys are never returned as key material: only the PEM/OpenSSH
  header line is read, to confirm the file is a private key and report
  its type (for example "OPENSSH PRIVATE KEY"). Shell history files are
  returned as only the lines matching credential-passing patterns
  (password/secret/token/api key/authorization/sshpass/mysql -u/-p, and
  -p with an argument), capped at 200 lines per file. Each path reports
  whether it is present, absent, or unreadable by the login user, and
  its size. Runs exactly one authentication attempt with the single
  username/password pair supplied -- never a spray, brute-force, or
  SSH-key auth mode. Read-only on the remote host. An unreachable host
  or failed SSH authentication is reported as a failed status, not an
  empty result. The remote login shell must be POSIX-compatible.

parameters:
  type: object
  properties:
    target:
      type: string
      description: >
        SSH target host or 'host:port', e.g. '10.0.0.15' or
        '10.0.0.15:2222'. The ssh client's own default port (22) applies
        when no port is given.
    ssh_user:
      type: string
      description: >
        SSH username for the single authentication attempt. Files are
        read from this user's home directory. Required.
    ssh_pass:
      type: string
      description: >
        SSH password for the single authentication attempt. Required --
        this tool only supports password authentication via sshpass, not
        key-based auth.
  required:
    - target
    - ssh_user
    - ssh_pass
