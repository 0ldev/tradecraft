tool_id: tcp_probe
scope_param: target

description: >
  Connects to a single TCP port using a raw socket with strict timeout to
  retrieve service banners, inspect raw service responses, or resolve
  ambiguity on ports reported as tcpwrapped, filtered, or un-fingerprinted.
  Can optionally initiate a TLS/SSL handshake or transmit an initial probe
  string before reading the response.

parameters:
  type: object
  properties:
    target:
      type: string
      description: >
        Target IP address or hostname to probe, e.g. '203.0.113.41' or
        'examplepaint.com.br'.
    port:
      type: integer
      description: >
        TCP destination port number (1-65535).
    ssl_probe:
      type: boolean
      description: >
        Whether to wrap the connection in TLS/SSL before sending or reading
        data (default false). Useful for HTTPS, SMTPS, IMAPS, or custom TLS
        services.
    send_data:
      type: string
      description: >
        Optional raw text line to send immediately upon connecting (e.g.
        'HEAD / HTTP/1.0\r\n\r\n' or '\r\n'). If omitted or empty, performs
        a passive banner grab waiting for the server to speak first.
    timeout:
      type: integer
      description: >
        Connection and read timeout in seconds (default 5, clamped between 1
        and 10 seconds).
  required: ["target", "port"]
