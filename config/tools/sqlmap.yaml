tool_id: sqlmap
required_binary: sqlmap
scope_param: target

description: >
  Test target web endpoints and parameters for SQL injection vulnerabilities using sqlmap in automated batch mode.

parameters:
  type: object
  properties:
    target:
      type: string
      description: >
        Target URL to test for SQL injection (e.g. 'https://example.com/search.php?q=test' or 'https://example.com/api/item').
    parameter:
      type: string
      description: >
        Specific HTTP parameter name to test (e.g. 'id', 'user', 'search'). If omitted, sqlmap tests parameters found in the target URL.
    data:
      type: string
      description: >
        Data string to be sent through POST body (e.g. 'id=1&name=test').
    method:
      type: string
      description: >
        HTTP method: 'GET' or 'POST'. Defaults to 'GET'.
    level:
      type: integer
      description: >
        Level of tests to perform (1-5). Level 1 tests standard parameters; each level above 1 adds more
        injection techniques and payload variations, substantially increasing the number of requests sent
        to the target per call. Defaults to 1.
    risk:
      type: integer
      description: >
        Risk of tests to perform (1-3). Risk 1 performs safe heuristic tests; risk 2 adds OR-based and
        time-based payloads and risk 3 adds potentially data-altering ones, each adding more requests per
        call on top of whatever `level` already sends. Defaults to 1.
  required: ["target"]
