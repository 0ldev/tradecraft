tool_id: smtp_probe
scope_param: target

description: >
  Performs single-shot, non-destructive interrogation of an SMTP/SMTPS mail
  service. Connects, captures service banner, issues EHLO to discover extended
  capabilities (STARTTLS, authentication mechanisms, message size limits),
  optionally upgrades to TLS via STARTTLS, and executes a single non-destructive
  VRFY probe to check for user enumeration oracles. Does not transmit or relay
  email messages.

parameters:
  type: object
  properties:
    target:
      type: string
      description: >
        Target IP address or mail hostname to probe (e.g. 'mail.example.com',
        'example.com', or direct IP).
    port:
      type: integer
      description: >
        SMTP port number (defaults to 25, automatically falls back to 587 if
        port 25 connection drops or times out; port 465 uses implicit TLS).
    starttls:
      type: boolean
      description: >
        Whether to issue STARTTLS and upgrade connection to TLS if advertised
        by the server (default true).
    vrfy_target:
      type: string
      description: >
        Username or email address to test with VRFY for user enumeration oracle
        detection (default 'root').
    timeout:
      type: integer
      description: >
        Connection and command timeout in seconds (default 5, clamped between 1
        and 10 seconds).
  required: ["target"]
