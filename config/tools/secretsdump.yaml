tool_id: secretsdump
required_binary: secretsdump.py
scope_param: target
destructive: true
destructive_categories:
  - credential_or_secret_exposure

description: >
  Targeted credential dumping via a DRSUAPI replication request (a
  DCSync-style dump), using Impacket's secretsdump.py -just-dc. Requires
  a credential with DCSync rights, not just local admin. Dumps NTLM
  hashes and Kerberos keys for every domain account by default, or pass
  just_dc_user to extract a single named account's material (e.g.
  'krbtgt' or 'Administrator') without dumping the whole domain. This is
  the same highest-consequence tier as a full NTDS.dit
  dump -- recovered hashes let an operator authenticate as, or forge
  tickets for, any account whose material was extracted. Entries whose
  NT hash is the well-known empty-password value are skipped. Returns up
  to 100 dumped entries per call, with a truncation flag and the full
  list kept as evidence; a credential lacking DCSync rights, or a
  successful dump that returns nothing, is reported as a 'reason', not
  an error. 120s process cap when just_dc_user is set, 600s for a full
  domain dump.

parameters:
  type: object
  properties:
    target:
      type: string
      description: >
        Domain controller IP address or hostname, e.g. '10.0.0.10' or
        'dc01.corp.local'. CIDR ranges, IP ranges, and target lists are
        rejected.
    domain:
      type: string
      description: >
        Active Directory domain to authenticate to and query, e.g.
        'corp.local'. Required.
    username:
      type: string
      description: >
        Username for the single authentication attempt. A bare username
        ('alice'), UPN ('alice@corp.local'), or 'corp.local\alice' is
        accepted; any domain part must match the domain argument.
    password:
      type: string
      description: >
        Plaintext password for the authentication attempt. Mutually
        exclusive with hashes. Exactly one of password or hashes is
        required.
    hashes:
      type: string
      description: >
        NTLM hash for pass-the-hash ('LMHASH:NTHASH' or 'NTHASH'), used
        instead of password. Mutually exclusive with password.
    dc_ip:
      type: string
      description: >
        Explicit domain controller IP address. Provide when target is a
        hostname that cannot be resolved; omitted for an IP target.
    just_dc_user:
      type: string
      description: >
        Optional: extract only this one account's NTDS.DIT data (a bare
        username, e.g. 'krbtgt' or 'Administrator') instead of dumping
        every account in the domain. Omit to dump the full domain.
  required:
    - target
    - domain
    - username
