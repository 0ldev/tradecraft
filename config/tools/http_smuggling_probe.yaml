tool_id: http_smuggling_probe
scope_param: target

description: >
  Single-shot, non-destructive HTTP request smuggling detector. Opens two
  fresh TCP/TLS connections in sequence and sends one HTTP/1.1 request on
  each, framed ambiguously with both Content-Length and Transfer-Encoding
  (one CL.TE-shaped, one TE.CL-shaped). Each request embeds a second GET to
  a unique nonce path that only this probe issues. Reports whether a second
  response arrives on the same connection, which indicates a front-end and
  back-end disagree on message framing. Makes exactly two requests per call
  and reads only its own responses.

parameters:
  type: object
  properties:
    target:
      type: string
      description: >
        Hostname or IP address of the HTTP(S) service to probe, e.g.
        'examplepaint.com.br'. Scheme and path are stripped if included.
    port:
      type: integer
      description: >
        TCP destination port (1-65535, default 443). Use 80 with ssl_probe
        false for plaintext HTTP.
    ssl_probe:
      type: boolean
      description: >
        Whether to wrap each connection in TLS before sending (default true).
        Set to false for plaintext HTTP on port 80.
    timeout:
      type: integer
      description: >
        Per-connection timeout in seconds (default 5, clamped between 1 and
        10 seconds). Each of the two connections is bounded by this value.
  required: ["target"]
