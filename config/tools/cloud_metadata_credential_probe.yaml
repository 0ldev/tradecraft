tool_id: cloud_metadata_credential_probe
scope_param: target
destructive: false

description: >
  Extracts real cloud credentials and access tokens from a target's cloud
  instance metadata service (IMDS) across AWS, GCP, and Azure, by chaining
  through an SSRF injection sink already found in the target's own
  backend -- the vulnerable backend makes the outbound metadata request on
  its own infrastructure, which is what actually reaches the target's
  metadata service. There is no mode that queries the metadata service
  directly from the scanning host: 169.254.169.254 and
  metadata.google.internal only ever resolve to whichever machine asks,
  so a direct query would reach the scanning host's own cloud metadata
  (if any), not the target's. For AWS, discovers the IAM role name and
  pulls temporary session credentials (AccessKeyId, SecretAccessKey,
  SessionToken). For GCP, retrieves service account OAuth tokens. For
  Azure, queries Managed Identity endpoints for access tokens -- GCP and
  Azure both require a header on the metadata request that pure URL/body
  SSRF cannot attach, so they typically only succeed when the SSRF sink
  also forwards a chosen header (see 'header' below); a 403 from either
  is an expected limit of the technique, not a tool failure. Does not
  automatically pivot or execute commands with stolen credentials.
  Strictly bounded and read-only.

parameters:
  type: object
  properties:
    target:
      type: string
      description: >
        Target URL containing the SSRF injection sink with the '__SSRF__'
        placeholder (e.g. 'https://target.com/fetch?url=__SSRF__'), or base
        URL when inject_location is 'json_body' or 'header'.
    provider:
      type: string
      description: >
        Target cloud provider metadata endpoint to query: 'aws', 'gcp', 'azure',
        or 'auto' to probe and detect automatically. Defaults to 'aws'.
    inject_location:
      type: string
      description: >
        Where to inject the candidate metadata URL: 'url_param' (substitutes
        '__SSRF__' in target), 'json_body' (requires json_body_template), or
        'header' (requires header_name -- injects the metadata URL into a
        header the vulnerable backend reads to pick its own outbound
        request target, not the Metadata-Flavor/Metadata header the cloud
        provider itself requires). Defaults to 'url_param'.
    method:
      type: string
      description: >
        HTTP method to use: 'GET' or 'POST'. Defaults to 'POST' when
        inject_location is 'json_body', otherwise 'GET'.
    json_body_template:
      type: string
      description: >
        A JSON string with '__SSRF__' placeholder, required when
        inject_location is 'json_body'.
    header_name:
      type: string
      description: >
        Header name to inject the candidate metadata URL into, required when
        inject_location is 'header'.
    role_name:
      type: string
      description: >
        Specific IAM role name to pull credentials for (AWS only). If omitted,
        the role name is automatically discovered from metadata.
    timeout:
      type: integer
      description: Per-request timeout in seconds. Defaults to 10.
  required: ["target"]
